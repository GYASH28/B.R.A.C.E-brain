name: Next ingestion and connector qualification

on:
  push:
    branches:
      - production-next-ingestion-connectors-2026-09

permissions:
  contents: write

concurrency:
  group: next-ingestion-connectors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.result.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production-next-ingestion-connectors-2026-09
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply connector and ingestion UX patch
        run: node scripts/patch-next-ingestion-connectors.mjs
      - name: Targeted ingestion and connector tests
        run: node --test tests/connector-health.test.js tests/project-indexer-hardening.test.js tests/project-index-progress.test.js tests/index-outcome.test.js
      - run: npm run typecheck
      - run: git diff --check
      - name: Commit exact tested tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add electron/connector-service.ts src/lib/brace/types.ts src/components/brace/brace-app.tsx
          if ! git diff --cached --quiet; then
            git commit -m "feat: harden connector health and note-vault ingestion [skip ci]"
            git push origin HEAD:production-next-ingestion-connectors-2026-09
          fi
      - id: result
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:stress
      - name: Electron E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run electron:e2e
      - name: Electron E2E (Windows)
        if: runner.os == 'Windows'
        run: npm run electron:e2e
      - name: Electron MCP smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run electron:mcp-smoke
      - name: Electron MCP smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run electron:mcp-smoke
      - run: git diff --check
