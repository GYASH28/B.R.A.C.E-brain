name: Automation reliability qualification

on:
  push:
    branches:
      - production-automation-reliability-2026-09

permissions:
  contents: write

concurrency:
  group: automation-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production-automation-reliability-2026-09
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply automation interruption recovery
        run: node scripts/patch-automation-reliability.mjs
      - name: Automation reliability fixtures
        run: node --test tests/automation-recovery.test.js tests/automation-engine.test.js tests/memory-store.test.js
      - run: npm run verify
      - run: npm run test:stress
      - name: Electron E2E
        run: xvfb-run -a npm run electron:e2e
      - name: Electron MCP smoke
        run: xvfb-run -a npm run electron:mcp-smoke
      - run: git diff --check
      - name: Commit verified automation reliability changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: recover interrupted automation runs safely [skip ci]"
          git push origin HEAD:production-automation-reliability-2026-09
