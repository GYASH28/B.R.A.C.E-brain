name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run license:audit
      - run: npm run verify
      - name: Long-running profile stress gate (Linux)
        if: runner.os == 'Linux'
        run: npm run test:stress
      - name: Electron E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run electron:e2e
      - name: Electron E2E (Windows)
        if: runner.os == 'Windows'
        run: npm run electron:e2e
      - name: Executable MCP smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run electron:mcp-smoke
      - name: Executable MCP smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run electron:mcp-smoke

  website:
    name: Website, layout, and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/builds/brace/package-lock.json
      - run: npm ci --prefix website/builds/brace
      - name: Audit launch and How-to pages
        shell: bash
        run: |
          python3 -m http.server 4517 --bind 127.0.0.1 --directory website/builds/brace > /tmp/brace-site.log 2>&1 &
          site_pid=$!
          trap 'kill "$site_pid"' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:4517/ > /dev/null
          npm run audit:a11y --prefix website/builds/brace
          npm run audit:layout --prefix website/builds/brace
          npm run audit:focus --prefix website/builds/brace
          npm run audit:interactions --prefix website/builds/brace
          npm run audit:visual --prefix website/builds/brace
      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brace-living-v7-visual-qa
          path: website/builds/brace/lab/visual/*.png
          if-no-files-found: error
          retention-days: 7
