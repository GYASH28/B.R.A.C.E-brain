name: Bug report
description: Report a reproducible BRACE problem using synthetic or redacted data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload databases, backups, exports, credentials, private project files, or screenshots containing personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps using the synthetic Northstar demo when possible.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux AppImage, Linux Debian package, Windows installer, Source checkout]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BRACE version
      placeholder: 0.1.0
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal data, credentials, private paths, databases, and memory exports from this report.
          required: true
