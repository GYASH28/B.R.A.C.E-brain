name: Pages

on:
  push:
    branches: [main]
    paths:
      - "website/builds/brace/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/builds/brace/package-lock.json
      - run: npm ci --prefix website/builds/brace
      - name: Verify website
        shell: bash
        run: |
          python3 -m http.server 4517 --bind 127.0.0.1 --directory website/builds/brace > /tmp/brace-site.log 2>&1 &
          site_pid=$!
          trap 'kill "$site_pid"' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:4517/ > /dev/null
          npm run audit:a11y --prefix website/builds/brace
          npm run audit:layout --prefix website/builds/brace
          npm run audit:interactions --prefix website/builds/brace
      - name: Stage optimized public site
        shell: bash
        run: |
          mkdir -p _site
          cp website/builds/brace/index.html _site/
          # V5 has one brand/layout authority on top of the stable semantic base.
          # Production concatenates both into one request.
          cat website/builds/brace/site-base.css \
              website/builds/brace/experience-v5.css > _site/site.css
          cp website/builds/brace/site.js _site/
          cp website/builds/brace/site-v5.js _site/
          cp website/builds/brace/motion.css _site/
          cp website/builds/brace/motion.js _site/
          cp website/builds/brace/favicon.ico _site/
          cp -R website/builds/brace/assets _site/
          cp -R website/builds/brace/vendor _site/
          cp -R website/builds/brace/guide _site/
          # Guide HTML already loads ../site.css. Keep only its semantic base and
          # V5 editorial layer in the deployed local stylesheet.
          cat website/builds/brace/guide/guide-base.css \
              website/builds/brace/guide/guide-v5.css > _site/guide/guide.css
          rm -f _site/guide/guide-base.css \
                _site/guide/guide-v3.css \
                _site/guide/guide-fixes.css \
                _site/guide/guide-v4.css \
                _site/guide/guide-v4-layout.css \
                _site/guide/guide-v5.css \
                _site/guide/site-base.css \
                _site/guide/liquid-glass.css \
                _site/guide/responsive-fixes.css \
                _site/guide/experience-v3.css \
                _site/guide/experience-v4.css \
                _site/guide/experience-v4-layout.css \
                _site/guide/experience-v5.css
          cp -R website/builds/brace/how-to _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
