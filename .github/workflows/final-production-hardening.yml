name: Final production hardening

on:
  push:
    branches:
      - production-hardening-final-2026-09

permissions:
  contents: write

concurrency:
  group: final-production-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.result.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production-hardening-final-2026-09
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Materialize audited dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Apply current-tree security boundaries
        run: node scripts/patch-production-security.mjs
      - name: Security boundary fixtures
        run: node --test tests/ipc-security.test.js tests/embedding-adapters.test.js tests/electron-boundary.test.js tests/website-security-headers.test.js tests/assistant-context-cache.test.js tests/assistant-provider-boundary.test.js tests/database-recovery.test.js tests/project-indexer-hardening.test.js tests/dependency-audit-helper.test.js
      - name: Dependency audit (moderate or higher)
        run: node scripts/dependency-audit.js
      - run: npm run license:audit
      - run: git diff --check
      - name: Commit exact hardened tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "security: finalize audited production boundaries [skip ci]"
            git push origin HEAD:production-hardening-final-2026-09
          fi
      - id: result
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency audit (moderate or higher)
        run: node scripts/dependency-audit.js
      - run: npm run verify
      - run: npm run test:stress
      - name: Electron E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run electron:e2e
      - name: Electron E2E (Windows)
        if: runner.os == 'Windows'
        run: npm run electron:e2e
      - name: Electron MCP smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run electron:mcp-smoke
      - name: Electron MCP smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run electron:mcp-smoke
      - name: Construct unpacked desktop package
        run: npm run electron:pack
      - name: Audit packaged desktop payload
        run: npm run package:audit
      - run: git diff --check

  website:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/builds/brace/package-lock.json
      - run: npm ci --prefix website/builds/brace
      - name: Serve website
        shell: bash
        run: |
          python3 -m http.server 4517 --bind 127.0.0.1 --directory website/builds/brace > /tmp/brace-site.log 2>&1 &
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:4517/ > /dev/null
      - run: npm run audit:a11y --prefix website/builds/brace
      - run: npm run audit:layout --prefix website/builds/brace
      - run: npm run audit:focus --prefix website/builds/brace
      - run: npm run audit:interactions --prefix website/builds/brace
      - run: npm run audit:performance --prefix website/builds/brace
      - run: npm run audit:visual --prefix website/builds/brace
