name: Retrieval explainability qualification

on:
  push:
    branches:
      - production-retrieval-explainability-2026-09

permissions:
  contents: write

concurrency:
  group: retrieval-explainability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production-retrieval-explainability-2026-09
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/patch-retrieval-explainability.mjs
      - run: node --test tests/retrieval-explainability.test.js tests/memory-store.test.js tests/project-indexer-hardening.test.js
      - run: npm run verify
      - run: npm run test:stress
      - name: Electron E2E
        run: xvfb-run -a npm run electron:e2e
      - run: git diff --check
      - name: Commit verified retrieval explanations
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: explain local retrieval rankings [skip ci]"
          git push origin HEAD:production-retrieval-explainability-2026-09
