name: Release provenance qualification

on:
  push:
    branches:
      - production-release-attestations-2026-09

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Parse release workflow YAML
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release.yml", aliases: true); puts "release workflow YAML parsed"'
      - name: Verify provenance contract
        run: node --test tests/release-provenance.test.js
      - run: git diff --check
